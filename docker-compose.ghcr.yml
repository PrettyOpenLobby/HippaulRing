# Run the published images instead of building. Apply ON TOP of
# docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.ghcr.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.ghcr.yml up -d
#
# (or COMPOSE_FILE=docker-compose.yml:docker-compose.ghcr.yml in .env, then
# plain `docker compose up -d`). The image carries the cipher tables; your
# generated services/fedata/ is mounted over the image's empty copy, so step 2
# of the README still runs on the host. Needs Docker Compose 2.24 or newer
# (the `!reset` that drops the build step).

services:
  fellb:
    image: ghcr.io/prettyopenlobby/crystalring:${CRYSTALRING_TAG:-latest}
    pull_policy: missing
    build: !reset null
    volumes:
      - ./services/fedata:/app/fedata:ro
  felobby:
    image: ghcr.io/prettyopenlobby/crystalring:${CRYSTALRING_TAG:-latest}
    pull_policy: missing
    volumes:
      - ./services/fedata:/app/fedata:ro
  feworld:
    image: ghcr.io/prettyopenlobby/crystalring:${CRYSTALRING_TAG:-latest}
    pull_policy: missing
    volumes:
      - ./services/fedata:/app/fedata:ro
  femap:
    image: ghcr.io/prettyopenlobby/crystalring:${CRYSTALRING_TAG:-latest}
    pull_policy: missing
    volumes:
      - ./services/fedata:/app/fedata:ro
