# Run the published images instead of building. Apply ON TOP of the core's
# compose file and docker-compose.yml, from this directory:
#
#   docker compose --project-directory ../openlobby #       -f ../openlobby/docker-compose.yml -f docker-compose.yml #       -f docker-compose.ghcr.yml up -d
#
# The image carries the cipher tables; your generated services/fedata/ is
# mounted over the image's empty copy, so step 2 of the README still runs on
# the host. Paths here are relative to the core's directory, the project
# directory. Needs Docker Compose 2.24 or newer (the `!reset` that drops the
# build step).

services:
  fellb:
    image: ghcr.io/prettyopenlobby/hippaulring:${HIPPAULRING_TAG:-${CRYSTALRING_TAG:-latest}}
    pull_policy: missing
    build: !reset null
    volumes:
      - ../hippaulring/services/fedata:/app/fedata:ro
  felobby:
    image: ghcr.io/prettyopenlobby/hippaulring:${HIPPAULRING_TAG:-${CRYSTALRING_TAG:-latest}}
    pull_policy: missing
    volumes:
      - ../hippaulring/services/fedata:/app/fedata:ro
  feworld:
    image: ghcr.io/prettyopenlobby/hippaulring:${HIPPAULRING_TAG:-${CRYSTALRING_TAG:-latest}}
    pull_policy: missing
    volumes:
      - ../hippaulring/services/fedata:/app/fedata:ro
  femap:
    image: ghcr.io/prettyopenlobby/hippaulring:${HIPPAULRING_TAG:-${CRYSTALRING_TAG:-latest}}
    pull_policy: missing
    volumes:
      - ../hippaulring/services/fedata:/app/fedata:ro
