# Fantasy Earth game services. This file is an OVERRIDE of OpenLobby's compose
# file, not a stack of its own: the services join the core's project so they
# can use its PostgreSQL and Valkey services and its data volume. With both
# repositories checked out side by side, from this directory:
#
#   1. python tools/gen_blowfish_tables.py     (once)
#   2. python tools/fedata_build.py --client <your FE install>   (once)
#   3. docker compose --project-directory ../openlobby \
#          -f ../openlobby/docker-compose.yml -f docker-compose.yml \
#          up -d --build
#
# The image is built on the core image (openlobby:latest, or OPENLOBBY_IMAGE),
# so build the core before the first FE build. Paths in this file are relative
# to the core's directory, because that is the project directory.
#
# FE_ADVERTISE must be the address game clients reach this host on
# (empty = 127.0.0.1, same-machine testing only). It is read from the core's
# .env, since that is the project's.

# fellb owns the image build; the other services consume it with
# pull_policy: never so parallel builds cannot race on the tag.
x-app: &app
  image: hippaulring:latest
  pull_policy: never
  restart: unless-stopped
  environment: &feenv
    POL_ADVERTISE: "${FE_ADVERTISE:-}"
    # the characters, the mail and the world state (festore.py, femail.py,
    # festate.py) live in the core's PostgreSQL database; docs/database.md in
    # OpenLobby has the settings
    POL_DATABASE_URL: "postgresql://openlobby:${POL_DB_PASSWORD:-openlobby}@postgres:5432/openlobby"
    POL_VALKEY_URL: "valkey://valkey:6379/0"
  volumes:
    - pol-data:/data
    # fellb.log, felobby.log and feworld.log: kept across container recreates,
    # which the containers' own docker logs are not.
    - fe-logs:/logs
  depends_on:
    postgres:
      condition: service_healthy
    valkey:
      condition: service_healthy

volumes:
  fe-logs:

services:
  # The lobby balancer: one request, one reply naming the lobby's address.
  fellb:
    <<: *app
    build:
      context: ../hippaulring/services
      args:
        OPENLOBBY_IMAGE: "${OPENLOBBY_IMAGE:-openlobby:latest}"
    pull_policy: build
    environment:
      <<: *feenv
      POL_FELLB_IP: "${FE_ADVERTISE:-127.0.0.1}"
      POL_FELLB_PORT: "54848"
      POL_FELLB_LOBBY_PORT: "54849"
    entrypoint: ["python", "fellb.py"]
    ports:
      - "54848:54848"
    healthcheck: &pyhc
      test: ["CMD", "python", "-c", "import socket;socket.socket().close()"]
      interval: 30s
      timeout: 5s
      retries: 3

  felobby:
    <<: *app
    # serving mode: no capture limit, no lifetime, three character slots
    entrypoint: ["python", "felobby.py", "--port", "54849", "--captures", "0",
                 "--life", "0", "--read-window", "300", "--char-slots", "3",
                 "--world-ip", "${FE_ADVERTISE:-127.0.0.1}", "--world-port", "54850"]
    ports:
      - "54849:54849"
    healthcheck: *pyhc

  feworld:
    <<: *app
    # The game rules and the world data are the parser's defaults (see
    # RELEASE_DEFAULTS in world/launch.py); override any of them by giving the
    # option here. Spawn positions: fedata/fe_spawn.json seeds the spawn row
    # of fe_world_state on the first start; in-game !spawn edits persist in
    # the database afterwards.
    entrypoint: ["python", "feworld.py"]
    ports:
      - "54850:54850"
    healthcheck: *pyhc

  # Optional: live dominion-map web view (and Discord webhook if configured).
  femap:
    <<: *app
    profiles: ["map"]
    entrypoint: ["python", "femap.py"]
    ports:
      - "127.0.0.1:8797:8797"
    healthcheck: *pyhc
